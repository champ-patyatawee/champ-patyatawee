<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างเว็บจองที่พักด้วย AI — 9:16 Video</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&family=Noto+Sans+Thai:wght@600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --bg:#F7F7F4; --surface:#fff; --text:#111; --muted:#6b7280;
    --primary:#1E50FF; --accent:#D9FF2A; --border:#111;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0a;
    min-height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    font-family:'Inter','Noto Sans Thai',sans-serif;
  }
  .wrap{
    width:100vw; flex:1;
    min-height:calc(100vh - 64px);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    padding:12px;
    box-sizing:border-box;
  }
  .phone{
    width:min(1080px, 90vw, calc((100vh - 88px) * 9 / 16));
    aspect-ratio:9 / 16;
    height:auto;
    max-height:calc(100vh - 88px);
    background:var(--bg);
    background-image:
      linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px);
    background-size:40px 40px;
    position:relative;
    overflow:hidden;
    border:4px solid #111;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    flex-shrink:0;
    container-type:inline-size;
    container-name:phone;
  }
  /* scenes — manual click, no auto */
  .scene{
    position:absolute; inset:0;
    padding:80px 64px 100px;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none; visibility:hidden;
    transform:translateY(24px);
    transition:opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1), visibility .4s;
  }
  .scene.active{ opacity:1; pointer-events:auto; visibility:visible; transform:translateY(0); }

  /* scene hook */
  h1{
    font-family:'Poppins','Noto Sans Thai',sans-serif;
    font-weight:800; line-height:0.95; letter-spacing:-0.02em; color:var(--text);
  }
  .hook-title{ font-size:130px; line-height:1.15; }
  .scene-hook.active .hook-title{ animation:titleIn .9s cubic-bezier(.16,1,.3,1) both; }
  .scene-hook.active .hook-title .accent{ animation:accentPop .7s .35s cubic-bezier(.34,1.56,.64,1) both; display:inline-block; }
  .scene-hook.active .hook-title .blue{ animation:blueIn .6s .55s both; display:inline-block; }
  @keyframes titleIn{ from{opacity:0; transform:translateY(50px) scale(.92)} to{opacity:1; transform:translateY(0) scale(1)} }
  @keyframes accentPop{ 0%{transform:rotate(-1deg) scale(.7)} 60%{transform:rotate(-1deg) scale(1.08)} 100%{transform:rotate(-1deg) scale(1)} }
  @keyframes blueIn{ from{opacity:0; transform:translateX(-20px)} to{opacity:1; transform:translateX(0)} }
  /* subtle float after entrance */
  .scene-hook.active .hook-title{ animation:titleIn .9s cubic-bezier(.16,1,.3,1) both, floatSubtle 3s 1.2s ease-in-out infinite; }
  @keyframes floatSubtle{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .hook-title .accent{ background:var(--accent); padding:4px 20px; border:3px solid #111; border-radius:16px; display:inline-block; transform:rotate(-1deg); }
  .hook-title .blue{ color:var(--primary); }

  /* top nav — not fixed, not overlaying video */
  .controls{
    position:relative;
    height:64px; flex-shrink:0;
    background:rgba(17,17,17,.96); color:#fff; padding:0 20px;
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono'; font-size:14px; z-index:10;
    border-bottom:1px solid rgba(255,255,255,.12);
    width:100%;
  }
  .controls button{ background:var(--accent); color:#111; border:2px solid #fff; padding:10px 14px; border-radius:999px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .dots{ display:flex; gap:8px; align-items:center; }
  .dot-nav{ width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid transparent; cursor:pointer; transition:all .2s; }
  .dot-nav.active{ background:var(--accent); width:28px; border-radius:999px; border-color:#fff; }
  /* scenes */
  .scene{
    position:absolute; inset:0;
    padding:80px 64px 100px;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none; visibility:hidden;
    transform:translateY(24px);
    transition:opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1), visibility .4s;
  }
  .scene.active{ opacity:1; pointer-events:auto; visibility:visible; transform:translateY(0); }

  /* responsive 9:16 fix — scale fonts with phone width so scene stays 9:16 */
  @supports (container-type: inline-size) {
    .scene{ padding:7cqi 6cqi 9cqi; }
    .hook-title{ font-size:12cqi; line-height:1.2; }
    .hook-title .accent, .hook-title .blue{ padding:0.4cqi 1.9cqi; border-width:0.28cqi; border-radius:1.5cqi; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone">


    <section class="scene scene-hook" style="justify-content:center; align-items:center; text-align:center;">
      <h1 class="hook-title">สร้างเว็บ<br><span class="accent">จองที่พัก</span><br><span class="blue">ด้วย AI</span></h1>
    </section>

    <!-- SCENE 2 — same bg, no words -->
    <section class="scene scene-plain" style="justify-content:center; align-items:center;"></section>

  </div>
</div>
<div class="controls">
  <div class="dots" id="dots"></div>
  <span id="counter" style="min-width:60px; text-align:center; font-weight:700;">1 / 2</span>
  <button onclick="document.getElementById('phone').requestFullscreen && document.getElementById('phone').requestFullscreen()" style="display:flex; align-items:center; gap:6px;"><i data-lucide="maximize" style="width:16px;height:16px;"></i> Fullscreen</button>
</div>
<script>
  lucide.createIcons();

  const scenes = [...document.querySelectorAll('.scene')];
  const dotsWrap = document.getElementById('dots');
  const counter = document.getElementById('counter');
  let idx = 0;

  scenes.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='dot-nav'; d.setAttribute('aria-label','Go to scene '+(i+1));
    d.addEventListener('click', ()=> show(i));
    dotsWrap.appendChild(d);
  });
  const dots=[...dotsWrap.children];

  function show(i){
    idx=(i+scenes.length)%scenes.length;
    scenes.forEach((s,j)=> s.classList.toggle('active', j===idx));
    dots.forEach((d,j)=> d.classList.toggle('active', j===idx));
    if(counter) counter.textContent=(idx+1)+' / '+scenes.length;
    lucide.createIcons();
  }
  function next(){ show(idx+1); }
  function prev(){ show(idx-1); }

  document.getElementById('phone')?.addEventListener('click', e=>{
    if(e.target.closest('a, button')) return;
    next();
  });
  let sx=0;
  document.getElementById('phone')?.addEventListener('touchstart', e=> sx=e.touches[0].clientX, {passive:true});
  document.getElementById('phone')?.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX - sx;
    if(Math.abs(dx)>40) dx<0 ? next() : prev();
  });
  window.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  });

  show(0);
</script>
</body>
</html>
