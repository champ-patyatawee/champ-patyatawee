<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F7F7F4"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Memphis decorations -->
  <circle cx="70" cy="100" r="42" fill="#1E50FF" stroke="#111111" stroke-width="2"/>
  <rect x="1080" y="80" width="80" height="80" fill="#D9FF2A" stroke="#111111" stroke-width="2"
        transform="rotate(10 1120 120)"/>
  <circle cx="1130" cy="540" r="48" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="600" y="100" text-anchor="middle"
        font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="34"
        fill="#111111">Vault + External Secrets Operator</text>

  <!-- Flow boxes -->
  <g font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#111111" text-anchor="middle">
    <rect x="60" y="210" width="220" height="110" rx="20" fill="#FFFFFF" stroke="#111111" stroke-width="2"
          filter="drop-shadow(6px 6px 0 #111111)"/>
    <text x="170" y="258">HashiCorp</text>
    <text x="170" y="290">Vault</text>

    <rect x="360" y="210" width="220" height="110" rx="20" fill="#FFFFFF" stroke="#111111" stroke-width="2"
          filter="drop-shadow(6px 6px 0 #111111)"/>
    <text x="470" y="258">SecretStore</text>

    <rect x="660" y="210" width="220" height="110" rx="20" fill="#FFFFFF" stroke="#111111" stroke-width="2"
          filter="drop-shadow(6px 6px 0 #111111)"/>
    <text x="770" y="258">ExternalSecret</text>

    <rect x="950" y="210" width="190" height="110" rx="20" fill="#D9FF2A" stroke="#111111" stroke-width="2"
          filter="drop-shadow(6px 6px 0 #111111)"/>
    <text x="1045" y="258">Kubernetes</text>
    <text x="1045" y="290">Secret</text>
  </g>

  <!-- Arrows -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <line x1="280" y1="265" x2="352" y2="265"/>
    <polygon points="352,258 368,265 352,272" fill="#111111"/>

    <line x1="580" y1="265" x2="652" y2="265"/>
    <polygon points="652,258 668,265 652,272" fill="#111111"/>

    <line x1="880" y1="265" x2="942" y2="265"/>
    <polygon points="942,258 958,265 942,272" fill="#111111"/>
  </g>

  <text x="600" y="430" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="24"
        fill="#111111">Sync secrets from Vault into your cluster, automatically.</text>

  <text x="600" y="520" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="20"
        fill="#555555">How to Install Vault and the External Secrets Operator on Kubernetes</text>
</svg>
