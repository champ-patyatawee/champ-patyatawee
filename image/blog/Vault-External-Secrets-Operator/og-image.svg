<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F7F7F4"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Memphis decorations -->
  <circle cx="1040" cy="120" r="70" fill="#3BE8F6" stroke="#111111" stroke-width="2"/>
  <rect x="90" y="460" width="90" height="90" fill="#D9FF2A" stroke="#111111" stroke-width="2"
        transform="rotate(12 135 505)"/>
  <rect x="930" y="470" width="130" height="56" rx="16" fill="#F5A9D6" stroke="#111111" stroke-width="2"
        transform="rotate(-6 995 498)"/>
  <circle cx="220" cy="150" r="34" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- Main card -->
  <rect x="210" y="90" width="780" height="450" rx="20" fill="#FFFFFF"
        stroke="#111111" stroke-width="2" filter="drop-shadow(8px 8px 0 #111111)"/>

  <!-- Top accent bar -->
  <rect x="210" y="90" width="780" height="10" rx="5" fill="#1E50FF"/>

  <text x="600" y="210" text-anchor="middle"
        font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46"
        fill="#111111">HashiCorp Vault</text>
  <text x="600" y="272" text-anchor="middle"
        font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46"
        fill="#111111">+ External Secrets Operator</text>

  <!-- Pill -->
  <rect x="425" y="320" width="350" height="52" rx="26" fill="#111111"/>
  <text x="600" y="355" text-anchor="middle"
        font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="24"
        fill="#D9FF2A">Install Guide for Kubernetes</text>

  <text x="600" y="440" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="22"
        fill="#555555">champ.patyatawee.com</text>
</svg>
