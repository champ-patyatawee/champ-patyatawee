apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-demo
  namespace: fleet-demo
spec:
  ingressClassName: traefik
  rules:
    - host: fleet-demo.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleet-demo
                port:
                  number: 80